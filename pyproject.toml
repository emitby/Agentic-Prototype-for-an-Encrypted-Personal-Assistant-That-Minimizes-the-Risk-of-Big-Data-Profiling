[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-personal-assistant"
version = "0.1.0"
description = "Multi-agent personal assistant with an encrypted vault: breach monitoring, flight search, grocery and supply tracking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.15", "cryptography>=42", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
assistant = "assistant.cli:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
